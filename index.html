<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Planner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a3128">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Planner">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 onclick="showView('dash')" style="cursor:pointer;">MY PLANNER</h1>
  <nav>
    <button data-view="dash" class="active"><span class="nav-ic" aria-hidden="true">🏠</span><span data-i18n="nav_home"></span></button>
    <button data-view="tasks"><span class="nav-ic" aria-hidden="true">✅</span><span data-i18n="nav_tasks"></span></button>
    <button data-view="cal"><span class="nav-ic" aria-hidden="true">📅</span><span data-i18n="nav_cal"></span></button>
    <button data-view="habits"><span class="nav-ic" aria-hidden="true">🔥</span><span data-i18n="nav_habits"></span></button>
    <button data-view="diary"><span class="nav-ic" aria-hidden="true">📔</span><span data-i18n="nav_diary"></span></button>
  </nav>
  <button class="icon-btn" id="btn-settings" onclick="showView('settings')" data-i18n-aria="settings">⚙</button>
</header>

<main>

  <!-- Dashboard -->
  <section id="view-dash" class="view active">
    <div class="dash-head">
      <div class="dash-date" id="dash-date"></div>
      <div class="dash-sum" id="dash-sum"></div>
    </div>
    <section class="hero" id="dash-hero" aria-live="polite"></section>
    <div class="card" id="dash-habits-card">
      <h2 data-i18n="today_habits"></h2>
      <div class="habit-chips" id="dash-habits"></div>
    </div>
    <div class="card">
      <h2 data-i18n="nav_tasks_short"></h2>
      <div id="dash-buckets"></div>
    </div>
    <div class="card">
      <h2 data-i18n="week_events"></h2>
      <div id="dash-events" class="tappable"></div>
      <div style="text-align:center; margin-top:10px;">
        <button class="ghost" id="btn-later" onclick="toggleLater()"></button>
      </div>
      <div id="dash-events-later" class="tappable" style="display:none;"></div>
    </div>
    <div style="text-align:center; margin-bottom:18px;">
      <button class="ghost" onclick="showView('stats')" data-i18n="open_stats"></button>
    </div>
  </section>

  <!-- Settings -->
  <section id="view-settings" class="view">
    <div style="margin-bottom:14px;">
      <button class="ghost" onclick="showView('dash')" data-i18n="back_home"></button>
    </div>
    <div class="card">
      <h2 data-i18n="settings"></h2>
      <div class="set-group">
        <button class="chip-btn" id="btn-notif" onclick="toggleNotif()"></button>
        <button class="chip-btn" onclick="toggleLang()" id="btn-lang"></button>
      </div>
      <div class="set-group" id="notif-offsets"></div>
      <div class="set-group" id="sound-chips"></div>
      <div class="set-group" id="theme-chips"></div>
    </div>
    <div class="card">
      <h2 data-i18n="data_title"></h2>
      <div class="set-group">
        <button class="chip-btn" onclick="exportData()" data-i18n="export"></button>
        <button class="chip-btn" onclick="document.getElementById('import-file').click()" data-i18n="import"></button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)">
      </div>
      <div class="set-group">
        <button class="chip-btn" onclick="exportICS()" data-i18n="ics_export"></button>
        <button class="chip-btn" onclick="document.getElementById('ics-file').click()" data-i18n="ics_import"></button>
        <input type="file" id="ics-file" accept=".ics" style="display:none" onchange="importICS(this)">
      </div>
      <div class="set-group" id="sync-area"></div>
    </div>
  </section>

  <!-- Tasks -->
  <section id="view-tasks" class="view">
    <div class="card">
      <h2 data-i18n="add_task"></h2>
      <div class="task-form">
        <input type="text" id="task-title" data-i18n-ph="task_name_ph" onkeydown="if(event.key==='Enter')addTask()">
      </div>
      <div class="due-row">
        <div class="due-chips" id="task-due-chips"></div>
        <input type="hidden" id="task-due">
      </div>
      <details class="more" id="task-more">
        <summary data-i18n="more_opts"></summary>
        <div class="task-form" style="margin-top:10px;">
          <input type="text" id="task-tag" data-i18n-ph="tag_ph" style="flex:0 1 130px; min-width:90px;">
          <span class="time-range">
            <input type="time" id="task-time" aria-label="start">
            <span>–</span>
            <input type="time" id="task-time-end" aria-label="end">
          </span>
          <select id="task-pri">
            <option value="mid" data-i18n="priority_mid"></option>
            <option value="high" data-i18n="priority_high"></option>
            <option value="low" data-i18n="priority_low"></option>
          </select>
          <label class="notify-label"><input type="checkbox" id="task-notify" checked><span data-i18n="notify_this"></span></label>
          <input type="time" id="task-notify-at" style="font-size:12px; padding:5px 7px;" aria-label="notify at">
        </div>
        <p class="hint" data-i18n="notify_at_hint"></p>
      </details>
      <div class="form-actions">
        <button class="primary" id="btn-task-add" onclick="addTask()"></button>
        <button class="ghost" id="btn-task-cancel" onclick="cancelTaskEdit()" style="display:none;"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="open_tasks"></h2>
      <div class="filter-bar">
        <input type="text" id="task-search" data-i18n-ph="search_ph" oninput="renderTasks()">
        <select id="task-tag-filter" onchange="renderTasks()"></select>
      </div>
      <div id="task-list-open"></div>
    </div>
    <div class="card">
      <h2 data-i18n="done_tasks"></h2>
      <div id="task-list-done"></div>
    </div>
    <div class="card">
      <h2 data-i18n="add_goal"></h2>
      <div class="task-form">
        <input type="text" id="proj-name" data-i18n-ph="goal_ph" onkeydown="if(event.key==='Enter')addProj()">
        <button class="primary" onclick="addProj()" data-i18n="add"></button>
      </div>
      <p class="hint" data-i18n="goal_hint"></p>
    </div>
    <div class="card">
      <h2 data-i18n="goals"></h2>
      <div id="proj-list"></div>
    </div>
  </section>

  <!-- Calendar -->
  <section id="view-cal" class="view">
    <div class="card">
      <div class="cal-header">
        <button onclick="calMove(-1)" aria-label="Previous month">←</button>
        <h2 id="cal-title"></h2>
        <span style="display:flex; gap:6px;">
          <button onclick="calToday()" data-i18n="today_word"></button>
          <button onclick="calMove(1)" aria-label="Next month">→</button>
        </span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </section>

  <!-- Habits -->
  <section id="view-habits" class="view">
    <div class="card pomo-card">
      <div>
        <div class="pomo-mode" id="pomo-mode"></div>
        <div class="pomo-time" id="pomo-time">25:00</div>
      </div>
      <div class="pomo-btns">
        <button class="primary" id="pomo-toggle" onclick="pomoToggle()"></button>
        <button class="ghost" onclick="pomoReset()" data-i18n="reset"></button>
      </div>
      <span class="time-range">
        <input type="number" id="pomo-work-min" min="1" max="180" style="width:56px;" onchange="setPomoCfg()">
        <span>/</span>
        <input type="number" id="pomo-break-min" min="1" max="60" style="width:50px;" onchange="setPomoCfg()">
        <span data-i18n="pomo_min"></span>
      </span>
      <div class="pomo-count" id="pomo-count"></div>
    </div>
    <div class="card">
      <h2 data-i18n="add_habit"></h2>
      <div class="task-form">
        <input type="text" id="habit-name" data-i18n-ph="habit_ph" onkeydown="if(event.key==='Enter')addHabit()">
        <span class="time-range"><span>⏰</span><input type="time" id="habit-remind"></span>
        <button class="primary" onclick="addHabit()" data-i18n="add"></button>
      </div>
      <p class="hint" data-i18n="habit_hint"></p>
    </div>
    <div class="card">
      <div class="cal-header" style="margin-bottom:10px;">
        <h2 data-i18n="habits" style="margin:0;"></h2>
        <span style="display:flex; gap:6px; align-items:center;">
          <button class="chip-btn" onclick="habitMove(1)">←</button>
          <span class="settings-label" id="habit-range-label" style="margin:0;"></span>
          <button class="chip-btn" onclick="habitMove(-1)">→</button>
          <button class="chip-btn" onclick="habitMove(0)" data-i18n="today_word"></button>
        </span>
      </div>
      <div id="habit-list"></div>
    </div>
  </section>

  <!-- Diary -->
  <section id="view-diary" class="view">
    <div class="card">
      <div class="cal-header">
        <button onclick="dCalMove(-1)" aria-label="Previous month">←</button>
        <h2 id="dcal-title"></h2>
        <span style="display:flex; gap:6px;">
          <button onclick="dCalToday()" data-i18n="today_word"></button>
          <button onclick="dCalMove(1)" aria-label="Next month">→</button>
        </span>
      </div>
      <div class="cal-grid" id="dcal-grid"></div>
    </div>
    <div class="card" id="diary-editor">
      <h2 id="diary-editor-title"></h2>
      <div class="mood-picker" id="mood-picker" style="margin-bottom:10px;"></div>
      <textarea id="diary-text" rows="6" style="width:100%;" data-i18n-ph="entry_ph"></textarea>
      <div class="form-actions" style="justify-content:space-between;">
        <button class="ghost" id="btn-diary-del" onclick="delDiary(selectedDiaryDate)" data-i18n="del_label"></button>
        <span style="display:flex; gap:8px; align-items:center;">
          <span class="saved-note" id="diary-saved"></span>
          <button class="primary" onclick="saveDiary()" data-i18n="save"></button>
        </span>
      </div>
    </div>
  </section>

  <!-- Stats -->
  <section id="view-stats" class="view">
    <div style="margin-bottom:14px;">
      <button class="ghost" onclick="showView('dash')" data-i18n="back_home"></button>
    </div>
    <div class="dash-grid">
      <div class="card">
        <div class="stat" id="st-rate">–</div>
        <div class="stat-label" data-i18n="stats_rate"></div>
      </div>
      <div class="card">
        <div class="stat" id="st-pomo-total">0</div>
        <div class="stat-label" data-i18n="stats_pomo_total"></div>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="stats_done"></h2>
      <div class="chart-bars" id="st-done"></div>
    </div>
    <div class="card">
      <h2 data-i18n="stats_pomo"></h2>
      <div class="chart-bars" id="st-pomo"></div>
    </div>
    <div class="card">
      <h2 data-i18n="stats_pri"></h2>
      <div id="st-pri"></div>
    </div>
    <div class="card">
      <h2 data-i18n="stats_mood"></h2>
      <div class="mood-week" id="st-mood"></div>
    </div>
    <div class="card">
      <div class="cal-header" style="margin-bottom:6px;">
        <h2 data-i18n="stats_habits" style="margin:0;"></h2>
        <span id="st-habit-range" style="display:flex; gap:6px; align-items:center;"></span>
      </div>
      <div class="settings-label" id="st-habit-label" style="text-align:center; display:block; margin-bottom:10px;"></div>
      <div id="st-habits"></div>
    </div>
  </section>

</main>

<!-- Day modal -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-date"></h3>
      <button class="icon-btn modal-x" onclick="closeModal()" data-i18n-aria="close">✕</button>
    </div>
    <div class="modal-events" id="modal-events"></div>
    <div class="row">
      <input type="text" id="event-title" data-i18n-ph="event_ph" onkeydown="if(event.key==='Enter')addEvent()">
    </div>
    <div class="row">
      <span class="time-range">
        <input type="time" id="event-time">
        <span>–</span>
        <input type="time" id="event-time-end">
      </span>
      <span class="color-swatches" id="event-colors"></span>
    </div>
    <div class="row" id="row-repeat">
      <select id="event-repeat" onchange="updateRepeatUI()" aria-label="repeat">
        <option value="" data-i18n="repeat_none"></option>
        <option value="daily" data-i18n="repeat_daily"></option>
        <option value="weekly" data-i18n="repeat_weekly_opt"></option>
        <option value="monthly" data-i18n="repeat_monthly"></option>
      </select>
      <label class="repeat-label" id="row-until"><span data-i18n="repeat_until"></span><input type="date" id="event-until" style="font-size:12px; padding:5px 7px;"></label>
    </div>
    <div class="row">
      <label class="repeat-label"><input type="checkbox" id="event-notify" checked><span data-i18n="notify_this"></span></label>
      <input type="time" id="event-notify-at" style="font-size:12px; padding:5px 7px;">
    </div>
    <button class="primary" id="btn-event-add" onclick="addEvent()"></button>
    <button class="ghost" id="btn-event-cancel" onclick="cancelEventEdit()" style="display:none;"></button>
    <div class="modal-close"><button class="ghost" onclick="closeModal()" data-i18n="close"></button></div>
  </div>
</div>

<!-- Task sheet: view / edit one task without leaving the current screen -->
<div class="modal-bg sheet-bg" id="task-sheet-bg" onclick="if(event.target===this)closeTaskSheet()">
  <div class="modal sheet" role="dialog" aria-modal="true" aria-labelledby="ts-title">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="modal-head">
      <button class="ts-done-btn" id="ts-done" onclick="sheetToggleDone()"></button>
      <button class="icon-btn modal-x" onclick="closeTaskSheet()" data-i18n-aria="close">✕</button>
    </div>
    <textarea id="ts-title" class="ts-title" rows="1" maxlength="200" data-i18n-aria="task_name_ph"></textarea>
    <div class="due-chips" id="ts-due-chips"></div>
    <input type="hidden" id="ts-due">
    <div id="ts-subs" class="ts-subs"></div>
    <div class="sub-form" id="ts-sub-form" style="margin-left:0;" hidden>
      <input type="text" id="ts-sub-input" data-i18n-ph="sub_ph" onkeydown="if(event.key==='Enter')sheetAddSub()">
      <button class="ghost" onclick="sheetAddSub()" data-i18n="add"></button>
    </div>
    <button class="link-btn" id="ts-sub-open" onclick="openSheetSubForm()" data-i18n="add_sub"></button>
    <details class="more" id="ts-more">
      <summary id="ts-more-sum"></summary>
      <div class="task-form" style="margin-top:10px;">
        <input type="text" id="ts-tag" data-i18n-ph="tag_ph" style="flex:0 1 130px; min-width:90px;">
        <span class="time-range">
          <input type="time" id="ts-time" aria-label="start">
          <span>–</span>
          <input type="time" id="ts-time-end" aria-label="end">
        </span>
        <select id="ts-pri">
          <option value="mid" data-i18n="priority_mid"></option>
          <option value="high" data-i18n="priority_high"></option>
          <option value="low" data-i18n="priority_low"></option>
        </select>
        <label class="notify-label"><input type="checkbox" id="ts-notify"><span data-i18n="notify_this"></span></label>
        <input type="time" id="ts-notify-at" style="font-size:12px; padding:5px 7px;" aria-label="notify at">
      </div>
    </details>
    <div class="form-actions" style="justify-content:space-between; margin-top:16px;">
      <button class="link-btn danger" onclick="sheetDelete()" data-i18n="del_task"></button>
      <button class="primary" onclick="saveTaskSheet()" data-i18n="save"></button>
    </div>
  </div>
</div>

<!-- Undo toast -->
<div id="toast">
  <span id="toast-msg"></span>
  <button onclick="undoDelete()" data-i18n="undo"></button>
</div>

<script src="app.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");</script>
</body>
</html>
